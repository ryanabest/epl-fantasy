name: Update EPL Fantasy Data

on:
  schedule:
    # Weekends: every 15 min, 11:00-23:59 UTC (covers all PL kickoff windows in BST/GMT)
    - cron: '7,22,37,52 11-23 * * 0,6'
    # Weekday evenings: every 15 min, 17:00-22:59 UTC (midweek/Friday fixtures)
    - cron: '7,22,37,52 17-22 * * 1-5'
  workflow_dispatch:

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Create keys.json
        run: |
          cat > keys.json <<EOF
          {
            "sportradar": "${{ secrets.SPORTRADAR_API_KEY }}",
            "google": ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          }
          EOF

      - name: Determine active season year
        id: season
        run: echo "year=$(node -e "console.log(require('./config').default.year)")" >> $GITHUB_OUTPUT

      - name: Sync draft rosters from Google Sheet
        run: node google/scrape.cjs

      - name: Scrape SportRadar schedule and results
        continue-on-error: true
        run: node sportradar/scrape.cjs > /tmp/scrape_output.txt 2>&1

      - name: Check for authentication error
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if grep -qi "authentication" /tmp/scrape_output.txt; then
            echo "Auth error detected - creating GitHub issue"
            BODY=$(cat <<'ISSUE_EOF'
          The SportRadar API trial key has expired and needs to be regenerated.

          ## Error details
          The scrape job failed with an authentication error:
          ```
          ISSUE_EOF
            )
            BODY="$BODY$(cat /tmp/scrape_output.txt | tail -20)"
            BODY="$BODY$(cat <<'ISSUE_EOF'
          ```

          ## Action required
          Generate a new trial API key from SportRadar and update the `SPORTRADAR_API_KEY` secret in GitHub.
          ISSUE_EOF
            )"
            gh issue create \
              --title "SportRadar API key expired" \
              --label "api-key-expired" \
              --body "$BODY"
            exit 1
          fi
          cat /tmp/scrape_output.txt

      - name: Discard timestamp-only scrape changes
        run: |
          for f in $(git diff --name-only -- sportradar/ google/); do
            content_lines=$(git diff -- "$f" | grep -E '^[+-][^+-]')
            non_timestamp_lines=$(echo "$content_lines" | grep -vE '"(generated_at|last_updated)"\s*:')
            if [ -z "$non_timestamp_lines" ]; then
              echo "Reverting timestamp-only change: $f"
              git checkout -- "$f"
            fi
          done

      - name: Check for real source data changes
        id: check_source
        run: |
          CHANGED=$(git status --porcelain -- sportradar/ google/)
          if [ -n "$CHANGED" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Compile data.json
        if: steps.check_source.outputs.has_changes == 'true'
        env:
          YEAR: ${{ steps.season.outputs.year }}
        run: |
          if [ -f "google/$YEAR/rosters.json" ] && [ -d "ref/$YEAR/player_profiles" ] && [ -n "$(ls -A ref/$YEAR/player_profiles 2>/dev/null)" ]; then
            node sportradar/compile.cjs
          else
            echo "Skipping compile — draft roster or player profiles for $YEAR aren't set up yet."
          fi

      - name: Check for updates
        id: check
        if: steps.check_source.outputs.has_changes == 'true'
        run: |
          CHANGED=$(git status --porcelain -- sportradar/ google/ src/assets/)
          if [ -n "$CHANGED" ]; then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
          else
            echo "should_deploy=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.check.outputs.should_deploy == 'true'
        env:
          YEAR: ${{ steps.season.outputs.year }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sportradar/ google/ src/assets/
          git commit -m "Update $YEAR data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
